name: Publish institutional CNAME aliases

on:
  push:
    branches: [main]
    paths:
      - "data/institutional-cnames.json"
      - "scripts/publish-institutional-cnames.mjs"
      - ".github/workflows/publish-institutional-cnames.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnic-cloudflare-institutional-cnames
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and preview
        run: |
          npm test
          npm run validate
          node scripts/publish-institutional-cnames.mjs --dry-run
      - name: Publish approved institutional aliases
        run: node scripts/publish-institutional-cnames.mjs --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
