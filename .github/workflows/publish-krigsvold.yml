name: Publish Krigsvold pilot CNAME

on:
  push:
    branches: [main]
    paths:
      - "domains/krigsvold.json"
      - "scripts/publish-krigsvold.mjs"
      - ".github/workflows/publish-krigsvold.yml"

permissions:
  contents: read

concurrency:
  group: wnic-cloudflare-krigsvold
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate registry and run tests
        run: |
          npm test
          npm run validate
      - name: Print exact DNS dry run
        run: node scripts/publish-krigsvold.mjs --dry-run
      - name: Create exact Krigsvold DNS record if absent
        run: node scripts/publish-krigsvold.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
