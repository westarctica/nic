name: Diagnose Cloudflare authorization (read-only)

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose-cloudflare.mjs"
      - ".github/workflows/diagnose-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Inspect Cloudflare token scope without making changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: node --check scripts/diagnose-cloudflare.mjs
      - name: Read-only Cloudflare API diagnostics
        run: node scripts/diagnose-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
